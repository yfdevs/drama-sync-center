<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">多平台剧数据同步中心</title>
  <desc id="desc">三个逐步对齐的内容层汇入统一播放层，代表多平台短剧数据同步</desc>

  <!--
    Brand idea: content from separate platforms resolves into one canonical record.
    Every layer shares the same dimensions, radius and offset for precise geometry.
  -->
  <rect width="512" height="512" rx="108" fill="#2455D6"/>

  <!-- Three equal content records, offset on one 40 px rhythm. -->
  <rect x="92" y="92" width="248" height="248" rx="44" fill="#69C9EF"/>
  <rect x="132" y="132" width="248" height="248" rx="44" fill="#BCEBFA"/>
  <rect x="172" y="172" width="248" height="248" rx="44" fill="#FFFFFF"/>

  <!-- The final aligned record is the playable short-drama asset. -->
  <path d="m270 250 80 46-80 46Z" fill="#17357D" stroke="#17357D" stroke-linejoin="round" stroke-width="12"/>
</svg>
